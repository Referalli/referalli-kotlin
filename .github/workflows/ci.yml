# Generated by the Referalli monorepo (scripts/release/mirror-files); edits here are overwritten on the next sync.
# Adopted from the WS4 package CI (packages/sdk-*/ci/workflows/ci.yml); this copy is canonical.
# The Gradle project sits at the mirror repo root.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: build + test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build (compile, test, jars)
        run: gradle --no-daemon build
      - name: Test
        run: gradle --no-daemon test
      - name: Stage the Maven publication (unsigned dry run)
        run: gradle --no-daemon publishMavenPublicationToStagingRepository
      - uses: actions/upload-artifact@v4
        if: matrix.java == '17'
        with:
          name: referalli-kotlin-jars
          path: |
            build/libs/*.jar
            build/staging/**
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports-${{ matrix.java }}
          path: build/reports/**

  android-consumer:
    # The tracker must stay Android-safe (no java.net.http in Tracker.kt): build referalli-android
    # against this commit.
    name: referalli-android against this commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdk-kotlin
      - uses: actions/checkout@v4
        with:
          repository: referalli/referalli-android
          ref: main
          path: sdk-android
      - name: Tracker.kt does not use java.net.http
        run: "! grep -rn 'java.net.http' $(find sdk-kotlin/src/main -name Tracker.kt)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - working-directory: sdk-android
        run: gradle --no-daemon testReleaseUnitTest assembleRelease
